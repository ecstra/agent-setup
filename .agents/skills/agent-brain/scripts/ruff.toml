# The kit's own lint for the tool's code, run by the post write hook and the gates.
# The tool runs on Python 3.9, so no rule may ask for a newer syntax.
target-version = "py39"
# The tool's messages and patterns run long, and a long line beats one split mid sentence.
line-length = 320

[lint]
select = ["F", "E9", "TID251", "RET505"]

[lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "the kit's code imports no future annotations, it runs on 3.9 with typing.Optional and Union"
